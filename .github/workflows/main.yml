name: LifeTools - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifetools-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy to Surge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build LifeTools
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f dist/index.html
          test -f dist/200.html
          test -f dist/CNAME
          test -f dist/sitemap.xml
          echo "Build output verified successfully."

      - name: Deploy to Surge
        run: npx --yes surge@latest ./dist lifetools.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
